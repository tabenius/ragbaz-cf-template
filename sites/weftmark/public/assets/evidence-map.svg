  <rect width="720" height="480" fill="#eee6dd"/>
  <g stroke="#d3c6bb" fill="none" stroke-width="1"><path d="M40 80h640M40 160h640M40 240h640M40 320h640M40 400h640M120 40v400M240 40v400M360 40v400M480 40v400M600 40v400"/><circle cx="360" cy="235" r="158"/></g>
