  <g fill="#6f6059" font-family="monospace" font-size="10" letter-spacing="1.3"><text x="40" y="458">WEFTMARK / EVIDENCE REGISTER</text><text x="590" y="30">PLATE 02</text></g>
  <text x="360" y="430" fill="#6f6059" text-anchor="middle" font-family="Georgia,serif" font-size="12">Nostoi asks the separate question of ledger integrity.</text>
