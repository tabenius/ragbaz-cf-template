name: Deploy project website
on:
  workflow_dispatch:
    inputs:
      site:
        type: choice
        required: true
        options: [weftmark, nostoi, sylvae, rebekah]

permissions:
  contents: read

concurrency:
  group: website-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run deploy -- "$SITE" --production
        env:
          SITE: ${{ inputs.site }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run smoke:live -- "$SITE"
        env:
          SITE: ${{ inputs.site }}
