<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title description">
  <title id="title">The economical run</title>
  <desc id="description">A skill passes an explicit tier choice to reach a backend; the run receipt returns to review while the audit chain remains a separate record.</desc>
  <rect width="720" height="480" fill="#e9e7d6"/>
  <g stroke="#d3cdb4" fill="none" stroke-width="1"><path d="M40 90h640M40 170h640M40 250h640M40 330h640M40 410h640M130 40v400M250 40v400M370 40v400M490 40v400M610 40v400"/><circle cx="360" cy="245" r="150"/></g>
  <g fill="none" stroke="#2f7d52" stroke-width="1.5"><path d="M130 130h460M130 360h460M130 130v230M290 130v230M450 130v230M610 130v230"/><path d="M130 245h100M530 245h-80" stroke-dasharray="3 6"/><circle cx="360" cy="245" r="52"/></g>
  <g fill="#f6f5ec" stroke="#2f7d52" stroke-width="1.5"><rect x="70" y="106" width="120" height="48"/><rect x="412" y="106" width="128" height="48"/><rect x="70" y="336" width="120" height="48"/><rect x="412" y="336" width="128" height="48"/><circle cx="360" cy="245" r="52"/></g>
  <g fill="#33402f" font-family="monospace" font-size="11" letter-spacing="1.2" text-anchor="middle"><text x="130" y="135">SKILL</text><text x="476" y="135">TIER</text><text x="130" y="365">RECEIPT</text><text x="476" y="365">REVIEW</text><text x="360" y="240" font-size="10">RUN</text><text x="360" y="256" font-size="10">RECORD</text></g>
  <g stroke="#9c754b" stroke-width="2"><path d="M40 26h68M612 454h68M310 412h100"/></g>
  <g fill="#6f6656" font-family="monospace" font-size="10" letter-spacing="1.3"><text x="40" y="458">SYLVAE / GROVE REGISTER</text><text x="590" y="30">PLATE 03</text></g>
  <text x="360" y="433" fill="#6f6656" text-anchor="middle" font-family="Georgia,serif" font-size="12">The backend is chosen; the receipt is kept; the audit stays separate.</text>
</svg>
