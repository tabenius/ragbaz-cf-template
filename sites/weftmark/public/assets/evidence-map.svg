  <g fill="#f8f4ee" stroke="#654568" stroke-width="1.5"><rect x="76" y="96" width="108" height="48"/><rect x="306" y="96" width="108" height="48"/><rect x="536" y="96" width="108" height="48"/><rect x="76" y="326" width="108" height="48"/><rect x="306" y="326" width="108" height="48"/><rect x="536" y="326" width="108" height="48"/><circle cx="360" cy="235" r="49"/></g>
