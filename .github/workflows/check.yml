name: Website invariants
on: [push, pull_request]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Artifact exchange invariants
        run: node --test extensions/artifacts/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Portable artifact schemas
        run: |
          python -m venv "$RUNNER_TEMP/artifact-schema-env"
          "$RUNNER_TEMP/artifact-schema-env/bin/python" -m pip install 'jsonschema==4.25.1'
          "$RUNNER_TEMP/artifact-schema-env/bin/python" extensions/artifacts/tests/schema_check.py
      - run: npm run bundle
      - run: npm run smoke
      - name: Fleet and Nostoi browser checks
        run: |
          npm run smoke:browser
          npm run smoke:browser -- nostoi
        env:
          CHROMIUM: google-chrome
